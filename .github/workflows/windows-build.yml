name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable application
        shell: pwsh
        run: ./CombinedStudio-source/Build.ps1 -DotNet dotnet
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-VelvetVoice-win-x64
          path: outputs/FramePilot-VelvetVoice/
          if-no-files-found: error
          retention-days: 14
